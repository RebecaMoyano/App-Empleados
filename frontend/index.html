<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Empleados</title>
</head>
<body>
    <h1>Gestión de empleados</h1>
    <p id="estado-conexion"></p>
    <form id="form">
        <input type="email" placeholder="Correo electrónico" id="email" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit" id="button">Iniciar sesión</button>
        <button type="button" id="button-register">Registrarse</button>
    </form>
    <p id="mensaje-error" style="color:red;"></p>

    <script type="module" src="main.js"></script>
    <!-- <script type="module" src="js/auth.js"></script> -->
</body>
</html>
